spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyPhongTro;encrypt=true;trustServerCertificate=true

spring.datasource.username=sa
spring.datasource.password=sapassword

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# File upload directory
# For development (Windows): D:/PhongTro
# For production (Ubuntu): /var/www/PhongTro
app.upload-dir=D:/PhongTro

server.port=8080
server.addres=0.0.0.0

# Allow large file uploads (max 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
